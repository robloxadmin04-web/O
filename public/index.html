<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign in</title>
  <link rel="stylesheet" href="/style.css" />
  <script>
    // Applied before first paint so the theme never flashes.
    (function () {
      try {
        var t = window.localStorage.getItem("theme");
        if (t) { document.documentElement.setAttribute("data-theme", t); }
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <button type="button" class="theme-toggle" id="themeToggle" aria-label="Switch theme">
    <svg class="icon icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true">
      <circle cx="12" cy="12" r="4.2" />
      <path d="M12 2.4v2.2M12 19.4v2.2M2.4 12h2.2M19.4 12h2.2M5.2 5.2l1.6 1.6M17.2 17.2l1.6 1.6M18.8 5.2l-1.6 1.6M6.8 17.2l-1.6 1.6" />
    </svg>
    <svg class="icon icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true">
      <path d="M20 14.4A8.4 8.4 0 1 1 9.6 4a6.6 6.6 0 0 0 10.4 10.4Z" />
    </svg>
  </button>

  <div class="layout">
    <aside class="brand">
      <div class="brand__top">
        <span class="mark" aria-hidden="true">
          <svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="4.5" stroke-linecap="round">
            <circle cx="32" cy="19" r="12" />
            <path d="M32 31v25" />
            <path d="M32 41h12" />
            <path d="M32 49h8" />
          </svg>
        </span>
        <span class="wordmark">PROJECT&nbsp;Luripe</span>
      </div>

      <div class="brand__body">
        <p class="eyebrow">Solaries</p>
        <h1 class="brand__title">Your scripts.<br />One loader.</h1>
        <p class="brand__sub">Projects, keys, sessions, reward links.</p>
      </div>

      <div class="brand__art" aria-hidden="true">
        <svg viewBox="0 0 200 260" fill="none">
          <defs>
            <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="var(--art-hi)" />
              <stop offset="1" stop-color="var(--art-lo)" />
            </linearGradient>
          </defs>
          <circle cx="100" cy="70" r="52" stroke="url(#edge)" stroke-width="12" />
          <circle cx="100" cy="70" r="24" stroke="var(--art-lo)" stroke-width="6" />
          <path d="M100 122v122" stroke="url(#edge)" stroke-width="12" stroke-linecap="round" />
          <path d="M100 168h50" stroke="url(#edge)" stroke-width="12" stroke-linecap="round" />
          <path d="M100 204h34" stroke="var(--art-lo)" stroke-width="12" stroke-linecap="round" />
        </svg>
      </div>
    </aside>

    <main class="panel">
      <section class="card" aria-labelledby="title">
        <p class="eyebrow">SIGN IN</p>
        <h2 id="title">Welcome back</h2>
        <p class="sub">Access your dashboard</p>

        <button type="button" class="btn btn--ghost btn--icon" id="googleBtn">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
            <path fill="currentColor" d="M21.6 12.2c0-.7-.06-1.36-.18-2H12v3.79h5.4a4.63 4.63 0 0 1-2 3.04v2.52h3.24c1.9-1.75 2.96-4.33 2.96-7.35Z" />
            <path fill="currentColor" opacity=".78" d="M12 22c2.7 0 4.96-.9 6.62-2.43l-3.23-2.52c-.9.6-2.05.96-3.39.96-2.6 0-4.8-1.76-5.58-4.12H3.06v2.6A9.99 9.99 0 0 0 12 22Z" />
            <path fill="currentColor" opacity=".58" d="M6.42 13.89a6 6 0 0 1 0-3.83V7.47H3.06a10 10 0 0 0 0 9.02l3.36-2.6Z" />
            <path fill="currentColor" opacity=".38" d="M12 5.86c1.47 0 2.78.5 3.82 1.5l2.85-2.85C16.95 2.98 14.7 2 12 2A9.99 9.99 0 0 0 3.06 7.47l3.36 2.6C7.2 7.7 9.4 5.86 12 5.86Z" />
          </svg>
          <span>Continue with Google</span>
        </button>

        <div class="divider"><span>OR</span></div>

        <form id="loginForm" novalidate>
          <div class="field">
            <label for="email">EMAIL</label>
            <input type="email" id="email" name="email" placeholder="you@example.com" autocomplete="email" aria-describedby="emailError" required />
            <span class="error" id="emailError" role="alert"></span>
          </div>

          <div class="field">
            <div class="field__head">
              <label for="password">PASSWORD</label>
              <a class="link" href="#">Forgot password?</a>
            </div>
            <div class="pw-wrap">
              <input type="password" id="password" name="password" placeholder="Password" autocomplete="current-password" aria-describedby="passwordError" required />
              <button type="button" class="pw-toggle" id="pwToggle" aria-label="Show password">
                <svg class="icon icon-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true">
                  <path d="M2.5 12S6 5.8 12 5.8 21.5 12 21.5 12 18 18.2 12 18.2 2.5 12 2.5 12Z" />
                  <circle cx="12" cy="12" r="3.1" />
                </svg>
                <svg class="icon icon-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true">
                  <path d="M4 4l16 16" />
                  <path d="M9.9 5.6A9.4 9.4 0 0 1 12 5.4c6 0 9.5 6.2 9.5 6.2a17 17 0 0 1-2.5 3.3" />
                  <path d="M6.6 7.4A16.6 16.6 0 0 0 2.5 11.6s3.5 6.2 9.5 6.2c1 0 1.9-.15 2.7-.42" />
                  <path d="M10 10a3.1 3.1 0 0 0 4.2 4.3" />
                </svg>
              </button>
            </div>
            <span class="error" id="passwordError" role="alert"></span>
          </div>

          <label class="remember" for="remember">
            <span class="remember__text">
              <span class="remember__title">Remember me</span>
              <span class="remember__sub">Keep this session active for 7 days.</span>
            </span>
            <input type="checkbox" id="remember" name="remember" />
            <span class="box" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                <path d="M5 12.5 10 17.5 19 7" />
              </svg>
            </span>
          </label>

          <button type="submit" class="btn" id="submitBtn">
            <span class="btn__label">Sign in</span>
            <span class="spinner" aria-hidden="true"></span>
          </button>

          <p class="form-status" id="formStatus" role="status"></p>
        </form>

        <p class="foot">Don't have an account? <a class="link" href="#">Sign up</a></p>
      </section>
    </main>
  </div>

  <script src="/script.js"></script>
</body>
</html>

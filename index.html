<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign in</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="shell">
    <section class="card" aria-labelledby="title">
      <header class="card__head">
        <div class="logo" aria-hidden="true">O</div>
        <h1 id="title">Welcome back</h1>
        <p class="sub">Sign in to continue to your dashboard.</p>
      </header>

      <form id="loginForm" novalidate>
        <div class="field">
          <label for="email">Email</label>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="you@example.com"
            autocomplete="email"
            aria-describedby="emailError"
            required
          />
          <span class="error" id="emailError" role="alert"></span>
        </div>

        <div class="field">
          <label for="password">Password</label>
          <div class="pw-wrap">
            <input
              type="password"
              id="password"
              name="password"
              placeholder="Enter your password"
              autocomplete="current-password"
              aria-describedby="passwordError"
              required
            />
            <button type="button" class="pw-toggle" id="pwToggle" aria-label="Show password">
              Show
            </button>
          </div>
          <span class="error" id="passwordError" role="alert"></span>
        </div>

        <div class="row">
          <label class="check">
            <input type="checkbox" id="remember" name="remember" />
            <span>Remember me</span>
          </label>
          <a class="link" href="#">Forgot password?</a>
        </div>

        <button type="submit" class="btn" id="submitBtn">
          <span class="btn__label">Sign in</span>
          <span class="spinner" aria-hidden="true"></span>
        </button>

        <p class="form-status" id="formStatus" role="status"></p>
      </form>

      <div class="divider"><span>or</span></div>

      <div class="socials">
        <button type="button" class="btn btn--ghost">Continue with Google</button>
        <button type="button" class="btn btn--ghost">Continue with GitHub</button>
      </div>

      <footer class="card__foot">
        <p>Don't have an account? <a class="link" href="#">Create one</a></p>
      </footer>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
